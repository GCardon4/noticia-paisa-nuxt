[phases.setup]
nixPkgs = ['nodejs_22']

[phases.install]
cmds = [
  'npm install -g pnpm@10.28.2',
  'pnpm install --frozen-lockfile'
]

[phases.build]
cmds = ['pnpm build']

[start]
cmd = 'node .output/server/index.mjs'

[variables]
NODE_ENV = "production"
NITRO_HOST = "0.0.0.0"
NITRO_PORT = "3000"
